# 稲荷クラフト リアルタイム同期 Worker（Cloudflare Workers 無料プランで動作）
name = "inari-craft-live"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# データを読み込めるサイトの公開元（カンマ区切り）。他サイトからの埋め込みで無料枠を消費されないよう、公式サイトに限定しています。
# 独自ドメインに移行したときは、そのオリジン（例: "https://inari-craft.jp"）を追加してください。"*" にすると制限なし。
ALLOWED_ORIGINS = "https://kiutarou999-hash.github.io"

[[durable_objects.bindings]]
name = "LIVE_HUB"
class_name = "LiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

# INGEST_SECRET は `npx wrangler secret put INGEST_SECRET` で登録してください（このファイルには書かない）。
