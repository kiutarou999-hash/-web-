<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会社ランキング｜稲荷クラフト</title>
  <meta name="description" content="稲荷クラフトの会社ランキング。累計売上・社員数・株価・上場状況を確認できます。">
  <meta name="theme-color" content="#0f2a1d">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/img/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/live.js" defer></script>
  <script src="assets/js/companies-data.js" defer></script>
  <script src="assets/js/companies.js" defer></script>
</head>
<body data-page="companies">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">会社情報</span>
        <h1>会社ランキング</h1>
        <p>サーバー内の会社を累計売上順に掲載しています。会社は全ワールドグループ共通です。</p>
      </div>
    </section>

    <div class="container" style="padding-top:32px">
      <div id="companies-notice"></div>
      <div class="toolbar">
        <div class="grow search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label for="q" class="visually-hidden">会社名で検索</label>
          <input class="input" id="q" type="search" placeholder="会社名で検索" autocomplete="off">
        </div>
        <div>
          <label for="listed" class="visually-hidden">上場状況</label>
          <select class="select" id="listed">
            <option value="">すべての会社</option>
            <option value="listed">上場企業のみ</option>
            <option value="unlisted">非上場企業のみ</option>
          </select>
        </div>
        <div>
          <label for="sort" class="visually-hidden">並び替え</label>
          <select class="select" id="sort">
            <option value="sales-desc">累計売上が多い順</option>
            <option value="sales-asc">累計売上が少ない順</option>
            <option value="rank-desc">会社ランクが高い順</option>
            <option value="rank-asc">会社ランクが低い順</option>
            <option value="employees-desc">社員数が多い順</option>
            <option value="employees-asc">社員数が少ない順</option>
            <option value="stock-desc">株価が高い順</option>
            <option value="stock-asc">株価が安い順</option>
            <option value="name-asc">会社名順</option>
          </select>
        </div>
      </div>
      <p class="meta-line" id="companies-meta"></p>
      <div id="companies-list"><p class="loading">読み込み中…</p></div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <noscript><p style="text-align:center;padding:16px">このサイトを正しく表示するには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
